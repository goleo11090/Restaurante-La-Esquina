<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital - LA ESQUINA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            400: '#38bdf8',
                            500: '#0284c7',
                            600: '#0369a1',
                        }
                    }
                }
            }
        };
    </script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="h-full flex flex-col font-sans bg-slate-950 text-slate-100 antialiased select-none">

    <!-- Client Header with Large Restaurant Logo -->
    <header class="bg-slate-900 border-b border-slate-800 py-8 px-4 text-center sticky top-0 z-30 shadow-md">
        <div class="max-w-md mx-auto flex flex-col items-center justify-center space-y-3">
            <svg viewBox="0 0 1000 320" width="280" height="auto" class="mx-auto text-white fill-current">
                <path d="M 80 50 L 80 270 L 320 270" fill="none" stroke="currentColor" stroke-width="20" stroke-linecap="square" />
                <text x="350" y="115" font-family="serif" font-size="80" font-style="italic" font-weight="normal" fill="currentColor">Restaurante</text>
                <text x="80" y="235" font-family="serif" font-size="160" font-weight="bold" fill="currentColor">La esquina</text>
            </svg>
            <p class="text-xs font-bold text-slate-400 tracking-widest uppercase">Mariscos, Asados y Mas</p>
        </div>
    </header>

    <main class="flex-1 p-4 md:p-6 overflow-y-auto custom-scrollbar max-w-7xl w-full mx-auto space-y-6">
        <!-- Search & Categories Bar -->
        <div class="space-y-4 max-w-2xl mx-auto">
            <div class="relative">
                <input id="client-search-input" type="text" oninput="renderClientMenu()" placeholder="🔍 Buscar platillo, bebida o ingrediente..." class="w-full bg-slate-900 border border-slate-800 text-white font-bold text-sm rounded-2xl py-3 px-4 pl-11 focus:outline-none focus:ring-2 focus:ring-brand-500 shadow-lg">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-slate-500"></i>
            </div>
            <div id="client-categories-pills" class="flex items-center gap-2 overflow-x-auto pb-2 custom-scrollbar justify-center">
            </div>
        </div>

        <!-- Menu Cards Grid -->
        <div id="client-menu-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        Restaurante La Esquina © 2026 — Menú Digital en Tiempo Real
    </footer>

    <script>
        const defaultState = {
            activeMenuCategory: 'Todos',
            categorias: ['Platillos', 'Carnes', 'Bebidas', 'Postres', 'Entradas'],
            menu: [
                { 
                    id: 1, 
                    nombre: 'Puyaso Importado 10oz', 
                    precio: 95.00, 
                    categoria: 'Carnes', 
                    imagen: 'https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=400&q=80', 
                    descripcion: 'Corte magro a la parrilla con papas fritas y guacamol'
                },
                { 
                    id: 2, 
                    nombre: 'Hamburguesa La Esquina', 
                    precio: 55.00, 
                    categoria: 'Platillos', 
                    imagen: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=80', 
                    descripcion: 'Torta de carne premium, queso cheddar, tocino y aderezo especial'
                },
                { 
                    id: 3, 
                    nombre: 'Cerveza Gallo 350ml', 
                    precio: 20.00, 
                    categoria: 'Bebidas', 
                    imagen: 'https://images.unsplash.com/photo-1608270586620-248524c67de9?auto=format&fit=crop&w=400&q=80', 
                    descripcion: 'Cerveza nacional fría de frasco de vidrio'
                },
                { 
                    id: 4, 
                    nombre: 'Limonada Natural', 
                    precio: 15.00, 
                    categoria: 'Bebidas', 
                    imagen: 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=400&q=80', 
                    descripcion: 'Jugo de limón recién exprimido con jarabe de la casa'
                },
                { 
                    id: 5, 
                    nombre: 'Flan de la Casa', 
                    precio: 25.00, 
                    categoria: 'Postres', 
                    imagen: 'https://images.unsplash.com/photo-1528975604071-b4dc52a2d18c?auto=format&fit=crop&w=400&q=80', 
                    descripcion: 'Flan artesanal de leche condensada con caramelo líquido'
                }
            ]
        };

        let state = JSON.parse(JSON.stringify(defaultState));

        function loadStateFromStorage() {
            try {
                const saved = localStorage.getItem('gastrocontrol_esquina_v5_state');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed.menu) state.menu = parsed.menu;
                    if (parsed.categorias) state.categorias = parsed.categorias;
                }
            } catch (e) {
                console.error("Error cargando estado:", e);
            }
        }

        function setClientCategory(cat) {
            state.activeMenuCategory = cat;
            renderClientMenu();
        }

        function renderClientMenu() {
            loadStateFromStorage();

            const grid = document.getElementById('client-menu-grid');
            const pillsContainer = document.getElementById('client-categories-pills');
            const searchVal = (document.getElementById('client-search-input')?.value || '').toLowerCase().trim();
            if (!grid) return;

            if (pillsContainer) {
                const currentCat = state.activeMenuCategory || 'Todos';
                const allCats = ['Todos', ...state.categorias];
                pillsContainer.innerHTML = allCats.map(cat => `
                    <button onclick="setClientCategory('${cat}')" class="px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${currentCat === cat ? 'bg-brand-500 text-white shadow-md' : 'bg-slate-900 border border-slate-800 text-slate-400 hover:text-white'}">
                        ${cat}
                    </button>
                `).join('');
            }

            const currentCat = state.activeMenuCategory || 'Todos';
            let filtered = currentCat === 'Todos' ? state.menu : state.menu.filter(p => p.categoria === currentCat);

            if (searchVal) {
                filtered = filtered.filter(p => p.nombre.toLowerCase().includes(searchVal) || (p.descripcion && p.descripcion.toLowerCase().includes(searchVal)));
            }

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-slate-500 font-bold text-sm">No se encontraron platillos o bebidas con ese término.</div>';
                return;
            }

            grid.innerHTML = filtered.map(p => `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl flex flex-col justify-between transition hover:border-slate-700">
                    <div class="relative">
                        <img src="${p.imagen || 'https://placehold.co/400x250/1e293b/white?text=Comida'}" alt="${p.nombre}" class="w-full h-48 object-cover">
                        <span class="absolute top-3 right-3 bg-slate-950/80 backdrop-blur-md text-brand-400 border border-brand-500/30 text-[10px] font-bold px-3 py-1 rounded-full uppercase">
                            ${p.categoria}
                        </span>
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                        <div>
                            <h3 class="font-black text-white text-base leading-snug">${p.nombre}</h3>
                            <p class="text-xs text-slate-400 mt-1 leading-relaxed">${p.descripcion || 'Sin descripción detallada'}</p>
                        </div>
                        <div class="flex items-center justify-between pt-3 border-t border-slate-800/80">
                            <span class="text-lg font-black text-emerald-400">Q${p.precio.toFixed(2)}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.onload = function() {
            renderClientMenu();
            // Auto-refresh every 2 seconds to instantly catch any menu updates made by the admin in index.html
            setInterval(() => {
                loadStateFromStorage();
                renderClientMenu();
            }, 2000);
        };
    </script>
</body>
</html>
