<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital - Restaurante La Esquina</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            400: '#38bdf8',
                            500: '#0284c7',
                            600: '#0369a1',
                        }
                    }
                }
            }
        };
    </script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="h-full flex flex-col font-sans bg-slate-950 text-slate-100 antialiased select-none">

    <header class="bg-slate-900 border-b border-slate-800 py-6 px-4 text-center sticky top-0 z-30 shadow-md">
        <div class="max-w-md mx-auto flex flex-col items-center justify-center space-y-2">
            <div class="bg-amber-500/10 p-3 rounded-2xl border border-amber-500/30 shadow-lg flex items-center justify-center">
                <svg viewBox="0 0 1000 320" width="240" height="auto" class="text-amber-400 fill-current">
                    <path d="M 80 50 L 80 270 L 320 270" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="square" />
                    <text x="350" y="115" font-family="serif" font-size="80" font-style="italic" font-weight="normal" fill="currentColor">Restaurante</text>
                    <text x="80" y="235" font-family="serif" font-size="160" font-weight="bold" fill="currentColor">La esquina</text>
                </svg>
            </div>
            <p class="text-xs font-bold text-amber-400/90 tracking-widest uppercase">Mariscos, asados y mucho más ...</p>
        </div>
    </header>

    <main class="flex-1 p-4 md:p-6 overflow-y-auto custom-scrollbar max-w-7xl w-full mx-auto space-y-6">
        <div class="space-y-4 max-w-2xl mx-auto">
            <div class="relative">
                <input id="client-search-input" type="text" oninput="renderClientMenu()" placeholder="Buscar platillo, bebida o ingrediente..." class="w-full bg-slate-900 border border-slate-800 text-white font-bold text-sm rounded-2xl py-3 px-4 pl-11 focus:outline-none focus:ring-2 focus:ring-brand-500 shadow-lg">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-slate-500"></i>
            </div>
            <div id="client-categories-pills" class="flex items-center gap-2 overflow-x-auto pb-2 custom-scrollbar justify-center">
            </div>
        </div>

        <div id="client-menu-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        Restaurante La Esquina © 2026 — Menú Digital en Tiempo Real
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'la-esquina-pos-v5';
        const firebaseConfig = {
            apiKey: "AIzaSyADgzSxR1VM587RiNrgC4ylfR5-yiovFok",
            authDomain: "laesquinapos-69a89.firebaseapp.com",
            projectId: "laesquinapos-69a89",
            storageBucket: "laesquinapos-69a89.firebasestorage.app",
            messagingSenderId: "184903943379",
            appId: "1:184903943379:web:b206ba6a8610ba3ffa4026",
            measurementId: "G-MCMSCPX465"
        };

        let clientState = {
            activeMenuCategory: 'Todos',
            categorias: ['Platillos', 'Carnes', 'Bebidas', 'Postres', 'Entradas'],
            menu: [],
            insumos: []
        };

        async function initClientCloudSync() {
            try {
                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);
                const auth = getAuth(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'restaurant_state');
                const snap = await getDoc(docRef);
                if (snap.exists()) {
                    const data = snap.data();
                    if (data && data.state) {
                        clientState = Object.assign(clientState, data.state);
                    }
                }
                renderClientMenu();

                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data && data.state) {
                            clientState = Object.assign(clientState, data.state);
                            renderClientMenu();
                        }
                    }
                });
            } catch (e) {
                console.warn("Cloud sync client fallback warning:", e);
                const saved = localStorage.getItem('gastrocontrol_esquina_v5_cloud_fallback');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (parsed.menu) clientState.menu = parsed.menu;
                        if (parsed.categorias) clientState.categorias = parsed.categorias;
                        if (parsed.insumos) clientState.insumos = parsed.insumos;
                    } catch(err) {}
                }
                renderClientMenu();
            }
        }

        function calcularStockDisponibleProducto(prod) {
            if (!clientState.insumos || clientState.insumos.length === 0 || !prod.receta || prod.receta.length === 0) return 999;
            let maxPortions = Infinity;
            prod.receta.forEach(r => {
                const insumo = clientState.insumos.find(i => i.id === r.insumo_id);
                if (insumo) {
                    const possible = Math.floor(insumo.stock / r.cantidad);
                    if (possible < maxPortions) maxPortions = possible;
                } else {
                    maxPortions = 0;
                }
            });
            return maxPortions === Infinity ? 0 : maxPortions;
        }

        window.setClientCategory = function(cat) {
            clientState.activeMenuCategory = cat;
            renderClientMenu();
        };

        window.renderClientMenu = function() {
            const grid = document.getElementById('client-menu-grid');
            const pillsContainer = document.getElementById('client-categories-pills');
            const searchVal = (document.getElementById('client-search-input')?.value || '').toLowerCase().trim();
            if (!grid) return;

            if (pillsContainer) {
                const currentCat = clientState.activeMenuCategory || 'Todos';
                const allCats = ['Todos', ...clientState.categorias];
                pillsContainer.innerHTML = allCats.map(cat => `
                    <button onclick="setClientCategory('${cat}')" class="px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${currentCat === cat ? 'bg-brand-500 text-white shadow-md' : 'bg-slate-900 border border-slate-800 text-slate-400 hover:text-white'}">
                        ${cat}
                    </button>
                `).join('');
            }

            const currentCat = clientState.activeMenuCategory || 'Todos';
            let filtered = currentCat === 'Todos' ? clientState.menu : clientState.menu.filter(p => p.categoria === currentCat);

            if (searchVal) {
                filtered = filtered.filter(p => p.nombre.toLowerCase().includes(searchVal) || (p.descripcion && p.descripcion.toLowerCase().includes(searchVal)));
            }

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-slate-500 font-bold text-sm">No se encontraron platillos o bebidas con ese término.</div>';
                return;
            }

            grid.innerHTML = filtered.map(p => {
                const stock = calcularStockDisponibleProducto(p);
                const isAgotado = stock <= 0;
                const badge = isAgotado ? '<span class="absolute top-3 left-3 bg-rose-500 text-white text-[10px] font-black px-2.5 py-1 rounded-full uppercase">Agotado</span>' : '';

                return `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl flex flex-col justify-between transition hover:border-slate-700 ${isAgotado ? 'opacity-60' : ''}">
                        <div class="relative">
                            <img src="${p.imagen || 'https://placehold.co/400x250/1e293b/white?text=Comida'}" alt="${p.nombre}" class="w-full h-48 object-cover">
                            <span class="absolute top-3 right-3 bg-slate-950/80 backdrop-blur-md text-brand-400 border border-brand-500/30 text-[10px] font-bold px-3 py-1 rounded-full uppercase">
                                ${p.categoria}
                            </span>
                            ${badge}
                        </div>
                        <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                            <div>
                                <h3 class="font-black text-white text-base leading-snug">${p.nombre}</h3>
                                <p class="text-xs text-slate-400 mt-1 leading-relaxed">${p.descripcion || 'Sin descripción detallada'}</p>
                            </div>
                            <div class="flex items-center justify-between pt-3 border-t border-slate-800/80">
                                <span class="text-lg font-black text-emerald-400">Q${p.precio.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        };

        window.onload = function() {
            initClientCloudSync();
        };
    </script>
</body>
</html>
