<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastroControl POS - LA ESQUINA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- html2pdf & Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            400: '#38bdf8',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        };
    </script>

    <style>
        @media print {
            body * { visibility: hidden !important; }
            #printable-ticket, #printable-ticket * { 
                visibility: visible !important; 
                display: block !important;
            }
            #printable-ticket {
                position: absolute;
                left: 0;
                top: 0;
                width: 58mm;
                padding: 4px;
                font-family: 'Courier New', Courier, monospace;
                font-size: 11px;
                line-height: 1.2;
                color: #000;
                background: #fff;
            }
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        @keyframes pulse-red {
            0%, 100% { border-color: rgba(244, 63, 94, 0.8); box-shadow: 0 0 15px rgba(244, 63, 94, 0.4); }
            50% { border-color: rgba(225, 29, 72, 1); box-shadow: 0 0 25px rgba(225, 29, 72, 0.8); }
        }
        .kds-alert-overdue {
            animation: pulse-red 1.5s infinite ease-in-out;
            background-color: rgba(136, 19, 55, 0.25) !important;
        }
    </style>
</head>
<body class="h-full flex flex-col font-sans bg-slate-950 text-slate-100 antialiased select-none">

    <!-- LOGIN MODAL -->
    <div id="login-modal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-md w-full shadow-2xl space-y-6">
            <div class="text-center space-y-3">
                <div class="bg-amber-500/10 p-3 rounded-2xl border border-amber-500/30 inline-flex items-center justify-center shadow-lg">
                    <svg viewBox="0 0 1000 320" width="180" height="auto" class="text-amber-400 fill-current">
                        <path d="M 80 50 L 80 270 L 320 270" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="square" />
                        <text x="350" y="115" font-family="serif" font-size="80" font-style="italic" font-weight="normal" fill="currentColor">Restaurante</text>
                        <text x="80" y="235" font-family="serif" font-size="160" font-weight="bold" fill="currentColor">La esquina</text>
                    </svg>
                </div>
                <h2 class="text-xl font-black text-white">GastroControl POS</h2>
                <p class="text-xs text-slate-400">Ingrese sus credenciales de acceso</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1.5">Usuario</label>
                    <input id="login-user" type="text" required placeholder="Ej. servipicho" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1.5">Contraseña</label>
                    <input id="login-pass" type="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <button type="submit" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-black py-3.5 rounded-xl shadow-lg transition">
                    Iniciar Sesión
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app-container" class="hidden h-full flex flex-col">
        <header id="staff-header" class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex flex-wrap items-center justify-between gap-3 sticky top-0 z-30 shadow-md">
            <div class="flex items-center gap-3">
                <div class="bg-amber-500/10 p-2 rounded-xl border border-amber-500/30 shadow-lg flex items-center justify-center">
                    <svg viewBox="0 0 1000 320" width="130" height="auto" class="text-amber-400 fill-current">
                        <path d="M 80 50 L 80 270 L 320 270" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="square" />
                        <text x="350" y="115" font-family="serif" font-size="80" font-style="italic" font-weight="normal" fill="currentColor">Restaurante</text>
                        <text x="80" y="235" font-family="serif" font-size="160" font-weight="bold" fill="currentColor">La esquina</text>
                    </svg>
                </div>
                <div>
                    <h1 class="font-black text-xs tracking-wider text-amber-400 uppercase">GastroControl POS</h1>
                    <p id="current-user-badge" class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">Cargando...</p>
                </div>
            </div>

            <nav id="main-nav" class="flex items-center gap-2 overflow-x-auto pb-1 custom-scrollbar">
                <!-- Tabs generated dynamically based on permissions -->
            </nav>

            <div class="flex items-center gap-3">
                <button onclick="logout()" class="bg-slate-800 hover:bg-rose-500/20 text-slate-300 hover:text-rose-400 border border-slate-700 hover:border-rose-500/40 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-power-off"></i> Salir
                </button>
            </div>
        </header>

        <main id="main-content-area" class="flex-1 overflow-y-auto p-4 md:p-6 custom-scrollbar bg-slate-950">
            <!-- Dynamic view content -->
        </main>
    </div>

    <!-- PRINTABLE TICKET CONTAINER -->
    <div id="printable-ticket" class="hidden"></div>

    <!-- FIREBASE & APP SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'la-esquina-pos-v5';
        const firebaseConfig = {
            apiKey: "AIzaSyADgzSxR1VM587RiNrgC4ylfR5-yiovFok",
            authDomain: "laesquinapos-69a89.firebaseapp.com",
            projectId: "laesquinapos-69a89",
            storageBucket: "laesquinapos-69a89.firebasestorage.app",
            messagingSenderId: "184903943379",
            appId: "1:184903943379:web:b206ba6a8610ba3ffa4026",
            measurementId: "G-MCMSCPX465"
        };

        let db, cloudDocRef;
        let currentUser = null;
        let activeTab = 'pos';

        let state = {
            usuarios: [
                { id: 'u1', nombre: 'Super Admin', rol: 'admin', user: 'servipicho', pass: '16112021Alo' }
            ],
            mesas: [
                { id: 'm1', nombre: 'Mesa 1', estado: 'libre', comanda: [] },
                { id: 'm2', nombre: 'Mesa 2', estado: 'libre', comanda: [] },
                { id: 'm3', nombre: 'Mesa 3', estado: 'libre', comanda: [] },
                { id: 'm4', nombre: 'Mesa 4', estado: 'libre', comanda: [] },
                { id: 'm5', nombre: 'Mesa 5', estado: 'libre', comanda: [] },
                { id: 'm6', nombre: 'Mesa 6', estado: 'libre', comanda: [] },
                { id: 'llevar', nombre: 'Para Llevar', estado: 'libre', comanda: [] },
            ],
            categorias: ['Platillos', 'Carnes', 'Bebidas', 'Postres', 'Entradas'],
            menu: [
                { id: 'p1', nombre: 'Caldo de Mariscos La Esquina', categoria: 'Platillos', precio: 75.00, descripcion: 'Especialidad de la casa con camarón, pescado y jaiba', imagen: 'https://placehold.co/400x250/0f172a/38bdf8?text=Caldo+Mariscos', receta: [] },
                { id: 'p2', nombre: 'Carne Asada Especial', categoria: 'Carnes', precio: 85.00, descripcion: 'Corte jugoso acompañado de guacamole y frijoles', imagen: 'https://placehold.co/400x250/0f172a/38bdf8?text=Carne+Asada', receta: [] },
                { id: 'p3', nombre: 'Limonada con Hierbabuena', categoria: 'Bebidas', precio: 20.00, descripcion: 'Refrescante bebida natural', imagen: 'https://placehold.co/400x250/0f172a/38bdf8?text=Limonada', receta: [] }
            ],
            insumos: [
                { id: 'i1', nombre: 'Camarón (Lbs)', unidad: 'Lbs', stock: 50, costo: 35.00 },
                { id: 'i2', nombre: 'Carne de Res (Lbs)', unidad: 'Lbs', stock: 40, costo: 45.00 }
            ],
            ventas: [],
            ordenesKDS: []
        };

        async function initCloudSync() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                const auth = getAuth(app);
                await signInAnonymously(auth);

                cloudDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'restaurant_state');
                const snap = await getDoc(cloudDocRef);
                if (snap.exists()) {
                    const data = snap.data();
                    if (data && data.state) {
                        state = Object.assign(state, data.state);
                    }
                } else {
                    await setDoc(cloudDocRef, { state });
                }

                onSnapshot(cloudDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data && data.state) {
                            state = Object.assign(state, data.state);
                            // Ensure servipicho is always present
                            const servipichoExists = state.usuarios.some(u => u.user === 'servipicho');
                            if (!servipichoExists) {
                                state.usuarios.unshift({ id: 'u_super', nombre: 'Super Admin', rol: 'admin', user: 'servipicho', pass: '16112021Alo' });
                            }
                            renderApp();
                        }
                    }
                });
            } catch (e) {
                console.warn("Cloud sync warning:", e);
            }
            renderApp();
        }

        async function saveState() {
            // Ensure servipicho is immutable
            const servipicho = state.usuarios.find(u => u.user === 'servipicho');
            if (servipicho) {
                servipicho.pass = '16112021Alo';
                servipicho.rol = 'admin';
            } else {
                state.usuarios.unshift({ id: 'u_super', nombre: 'Super Admin', rol: 'admin', user: 'servipicho', pass: '16112021Alo' });
            }

            if (cloudDocRef) {
                try {
                    await setDoc(cloudDocRef, { state });
                } catch (e) {
                    console.error("Error saving to cloud:", e);
                }
            }
            renderApp();
        }

        window.handleLogin = function(e) {
            e.preventDefault();
            const uInput = document.getElementById('login-user').value.trim();
            const pInput = document.getElementById('login-pass').value.trim();

            const found = state.usuarios.find(u => u.user === uInput && u.pass === pInput);
            if (found) {
                currentUser = found;
                document.getElementById('login-modal').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                document.getElementById('current-user-badge').innerText = `${currentUser.nombre} (${currentUser.rol.toUpperCase()})`;
                activeTab = currentUser.rol === 'admin' ? 'pos' : 'pos';
                renderApp();
            } else {
                alert('Usuario o contraseña incorrectos');
            }
        };

        window.logout = function() {
            currentUser = null;
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('login-modal').classList.remove('hidden');
            document.getElementById('login-user').value = '';
            document.getElementById('login-pass').value = '';
        };

        window.switchTab = function(tab) {
            activeTab = tab;
            renderApp();
        };

        function renderApp() {
            if (!currentUser) return;
            const nav = document.getElementById('main-nav');
            const content = document.getElementById('main-content-area');

            let tabs = [
                { id: 'pos', label: 'Pedido (POS)', icon: 'fa-cash-register' },
                { id: 'kds', label: 'Cocina & Barra', icon: 'fa-fire-burner' },
                { id: 'menu', label: 'Menú & Recetas', icon: 'fa-utensils' }
            ];

            if (currentUser.rol === 'admin') {
                tabs.push(
                    { id: 'inventario', label: 'Inventario', icon: 'fa-boxes-stacked' },
                    { id: 'caja', label: 'Caja & Ventas', icon: 'fa-vault' },
                    { id: 'personal', label: 'Personal', icon: 'fa-users-gear' }
                );
            }

            nav.innerHTML = tabs.map(t => `
                <button onclick="switchTab('${t.id}')" class="px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 whitespace-nowrap ${activeTab === t.id ? 'bg-brand-500 text-white shadow-md' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">
                    <i class="fa-solid ${t.icon}"></i> ${t.label}
                </button>
            `).join('');

            if (activeTab === 'pos') renderPOSView(content);
            else if (activeTab === 'kds') renderKDSView(content);
            else if (activeTab === 'menu') renderMenuView(content);
            else if (activeTab === 'inventario' && currentUser.rol === 'admin') renderInventarioView(content);
            else if (activeTab === 'caja' && currentUser.rol === 'admin') renderCajaView(content);
            else if (activeTab === 'personal' && currentUser.rol === 'admin') renderPersonalView(content);
        }

        // POS VIEW
        let selectedMesaId = 'm1';
        function renderPOSView(container) {
            const mesa = state.mesas.find(m => m.id === selectedMesaId) || state.mesas[0];
            const totalMesa = mesa.comanda.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);

            container.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 h-full">
                    <div class="lg:col-span-4 space-y-4 flex flex-col">
                        <h2 class="text-sm font-black text-slate-400 uppercase tracking-wider">Mesas y Áreas</h2>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                            ${state.mesas.map(m => `
                                <button onclick="selectMesa('${m.id}')" class="p-3 rounded-2xl border text-left transition flex flex-col justify-between ${selectedMesaId === m.id ? 'bg-brand-500/20 border-brand-500 text-white shadow-lg' : 'bg-slate-900 border-slate-800 text-slate-300 hover:border-slate-700'}">
                                    <span class="font-black text-xs">${m.nombre}</span>
                                    <span class="text-[10px] font-bold ${m.comanda.length > 0 ? 'text-amber-400' : 'text-slate-500'}">${m.comanda.length > 0 ? 'Ocupada' : 'Libre'}</span>
                                </button>
                            `).join('')}
                        </div>
                        <div class="flex-1 bg-slate-900 border border-slate-800 rounded-3xl p-4 flex flex-col justify-between shadow-xl">
                            <div>
                                <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                                    <h3 class="font-black text-white text-base">Comanda: ${mesa.nombre}</h3>
                                    <span class="text-xs bg-brand-500/10 text-brand-400 border border-brand-500/30 px-2.5 py-1 rounded-full font-bold">${mesa.comanda.length} ítems</span>
                                </div>
                                <div class="space-y-2 mt-3 overflow-y-auto max-h-56 custom-scrollbar pr-1">
                                    ${mesa.comanda.length === 0 ? '<p class="text-xs text-slate-500 text-center py-8">La comanda está vacía</p>' : mesa.comanda.map((item, idx) => `
                                        <div class="flex items-center justify-between bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-xs">
                                            <div>
                                                <p class="font-bold text-white">${item.nombre}</p>
                                                <p class="text-[10px] text-emerald-400">Q${item.precio.toFixed(2)} x ${item.cantidad}</p>
                                            </div>
                                            <div class="flex items-center gap-2">
                                                <button onclick="cambiarCantidadComanda('${mesa.id}', ${idx}, -1)" class="w-6 h-6 bg-slate-800 rounded-lg text-slate-300 font-black">-</button>
                                                <span class="font-black text-white">${item.cantidad}</span>
                                                <button onclick="cambiarCantidadComanda('${mesa.id}', ${idx}, 1)" class="w-6 h-6 bg-slate-800 rounded-lg text-slate-300 font-black">+</button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            <div class="pt-4 border-t border-slate-800 space-y-3">
                                <div class="flex items-center justify-between text-base font-black">
                                    <span class="text-slate-400">Total:</span>
                                    <span class="text-emerald-400">Q${totalMesa.toFixed(2)}</span>
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="enviarComandaCocina('${mesa.id}')" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-black py-3 rounded-xl text-xs transition shadow-lg flex items-center justify-center gap-1.5">
                                        <i class="fa-solid fa-bell-concierge"></i> Cocina
                                    </button>
                                    <button onclick="cobrarComanda('${mesa.id}')" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black py-3 rounded-xl text-xs transition shadow-lg flex items-center justify-center gap-1.5">
                                        <i class="fa-solid fa-cash-register"></i> Cobrar
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="lg:col-span-8 flex flex-col space-y-4">
                        <div class="flex flex-wrap items-center justify-between gap-3">
                            <input type="text" id="pos-search" oninput="renderPOSMenuGrid()" placeholder="Buscar platillo..." class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white w-full sm:w-64 focus:outline-none focus:ring-2 focus:ring-brand-500">
                            <div id="pos-category-pills" class="flex items-center gap-2 overflow-x-auto pb-1 custom-scrollbar"></div>
                        </div>
                        <div id="pos-menu-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4 overflow-y-auto custom-scrollbar flex-1 pr-1"></div>
                    </div>
                </div>
            `;
            renderPOSMenuGrid();
        }

        let activePOSCat = 'Todos';
        window.selectMesa = function(id) { selectedMesaId = id; renderApp(); };
        window.setPOSCategory = function(cat) { activePOSCat = cat; renderPOSMenuGrid(); };

        window.renderPOSMenuGrid = function() {
            const grid = document.getElementById('pos-menu-grid');
            const pills = document.getElementById('pos-category-pills');
            const search = (document.getElementById('pos-search')?.value || '').toLowerCase().trim();
            if (!grid) return;

            if (pills) {
                const cats = ['Todos', ...state.categorias];
                pills.innerHTML = cats.map(c => `
                    <button onclick="setPOSCategory('${c}')" class="px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition ${activePOSCat === c ? 'bg-brand-500 text-white shadow-md' : 'bg-slate-900 border border-slate-800 text-slate-400 hover:text-white'}">
                        ${c}
                    </button>
                `).join('');
            }

            let list = activePOSCat === 'Todos' ? state.menu : state.menu.filter(p => p.categoria === activePOSCat);
            if (search) list = list.filter(p => p.nombre.toLowerCase().includes(search));

            if (list.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-slate-500 text-xs font-bold">No hay platillos disponibles</div>';
                return;
            }

            grid.innerHTML = list.map(p => `
                <div onclick="agregarAlPlatoMesa('${p.id}')" class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl hover:border-brand-500/50 transition cursor-pointer flex flex-col justify-between">
                    <img src="${p.imagen || 'https://placehold.co/400x250/1e293b/white?text=Comida'}" class="w-full h-32 object-cover">
                    <div class="p-3.5 flex flex-col justify-between flex-1">
                        <div>
                            <h4 class="font-black text-white text-sm">${p.nombre}</h4>
                            <p class="text-[11px] text-slate-400 mt-1 line-clamp-2">${p.descripcion || ''}</p>
                        </div>
                        <div class="flex items-center justify-between pt-3 mt-3 border-t border-slate-800">
                            <span class="font-black text-emerald-400 text-sm">Q${p.precio.toFixed(2)}</span>
                            <span class="bg-brand-500/10 text-brand-400 text-[10px] font-bold px-2 py-0.5 rounded-full">+ Agregar</span>
                        </div>
                    </div>
                </div>
            `).join('');
        };

        window.agregarAlPlatoMesa = function(prodId) {
            const mesa = state.mesas.find(m => m.id === selectedMesaId);
            const prod = state.menu.find(p => p.id === prodId);
            if (!mesa || !prod) return;

            const existing = mesa.comanda.find(i => i.id === prodId);
            if (existing) {
                existing.cantidad++;
            } else {
                mesa.comanda.push({ id: prod.id, nombre: prod.nombre, precio: prod.precio, cantidad: 1 });
            }
            saveState();
        };

        window.cambiarCantidadComanda = function(mesaId, idx, delta) {
            const mesa = state.mesas.find(m => m.id === mesaId);
            if (!mesa) return;
            mesa.comanda[idx].cantidad += delta;
            if (mesa.comanda[idx].cantidad <= 0) {
                mesa.comanda.splice(idx, 1);
            }
            saveState();
        };

        window.enviarComandaCocina = function(mesaId) {
            const mesa = state.mesas.find(m => m.id === mesaId);
            if (!mesa || mesa.comanda.length === 0) {
                alert('La comanda está vacía');
                return;
            }

            state.ordenesKDS.push({
                id: 'ord_' + Date.now(),
                mesa: mesa.nombre,
                items: JSON.parse(JSON.stringify(mesa.comanda)),
                estado: 'Pendiente',
                tiempo: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });

            mesa.estado = 'ocupada';
            saveState();
            alert('Comanda enviada a Cocina & Barra con éxito');
        };

        window.cobrarComanda = function(mesaId) {
            const mesa = state.mesas.find(m => m.id === mesaId);
            if (!mesa || mesa.comanda.length === 0) {
                alert('No hay consumos para cobrar en esta mesa');
                return;
            }

            const total = mesa.comanda.reduce((acc, i) => acc + (i.precio * i.cantidad), 0);
            const metodo = prompt(`Total a cobrar: Q${total.toFixed(2)}\nSeleccione método de pago:\n1. Efectivo\n2. Tarjeta\n3. Transferencia / QR\n4. Pedidos Ya`, 'Efectivo');
            if (!metodo) return;

            let metodoPago = 'Efectivo';
            const mLower = metodo.toLowerCase();
            if (mLower.includes('tarj') || mLower === '2') metodoPago = 'Tarjeta';
            else if (mLower.includes('trans') || mLower.includes('qr') || mLower === '3') metodoPago = 'Transferencia';
            else if (mLower.includes('pedido') || mLower === '4') metodoPago = 'Pedidos Ya';

            state.ventas.push({
                id: 'v_' + Date.now(),
                mesa: mesa.nombre,
                items: JSON.parse(JSON.stringify(mesa.comanda)),
                total,
                metodo: metodoPago,
                fecha: new Date().toLocaleString()
            });

            mesa.comanda = [];
            mesa.estado = 'libre';
            saveState();
            alert(`¡Cobro exitoso por Q${total.toFixed(2)} (${metodoPago})!`);
        };

        // KDS VIEW
        function renderKDSView(container) {
            container.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h2 class="text-lg font-black text-white">Órdenes en Cocina & Barra</h2>
                        <span class="text-xs bg-slate-900 border border-slate-800 text-slate-400 px-3 py-1.5 rounded-xl font-bold">${state.ordenesKDS.length} órdenes totales</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${state.ordenesKDS.length === 0 ? '<div class="col-span-full text-center py-16 text-slate-500 text-xs font-bold">No hay órdenes pendientes en cocina</div>' : state.ordenesKDS.map(ord => `
                            <div class="bg-slate-900 border ${ord.estado === 'Pendiente' ? 'border-amber-500/40' : 'border-slate-800'} rounded-3xl p-5 shadow-xl flex flex-col justify-between space-y-4">
                                <div>
                                    <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                                        <h3 class="font-black text-amber-400 text-base">${ord.mesa}</h3>
                                        <span class="text-[10px] bg-slate-950 px-2.5 py-1 rounded-full font-bold text-slate-400">${ord.tiempo}</span>
                                    </div>
                                    <ul class="space-y-2 mt-3">
                                        ${ord.items.map(i => `
                                            <li class="flex items-center justify-between text-xs">
                                                <span class="font-bold text-white">${i.cantidad}x ${i.nombre}</span>
                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>
                                <div class="pt-3 border-t border-slate-800 flex items-center justify-between">
                                    <span class="text-[10px] font-bold px-2.5 py-1 rounded-full ${ord.estado === 'Pendiente' ? 'bg-amber-500/10 text-amber-400' : 'bg-emerald-500/10 text-emerald-400'}">${ord.estado}</span>
                                    ${ord.estado === 'Pendiente' ? `<button onclick="marcarOrdenLista('${ord.id}')" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black px-3.5 py-2 rounded-xl text-xs transition shadow-lg">Completar</button>` : `<button onclick="eliminarOrdenKDS('${ord.id}')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-3 py-1.5 rounded-xl text-xs transition">Limpiar</button>`}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        window.marcarOrdenLista = function(id) {
            const ord = state.ordenesKDS.find(o => o.id === id);
            if (ord) { ord.estado = 'Listo'; saveState(); }
        };

        window.eliminarOrdenKDS = function(id) {
            state.ordenesKDS = state.ordenesKDS.filter(o => o.id !== id);
            saveState();
        };

        // MENU VIEW
        function renderMenuView(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex flex-wrap items-center justify-between gap-4">
                        <h2 class="text-lg font-black text-white">Gestión de Menú y Recetas</h2>
                        ${currentUser.rol === 'admin' ? `
                            <div class="flex items-center gap-2">
                                <button onclick="abrirModalCategoria()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-black px-4 py-2.5 rounded-xl text-xs transition shadow-lg">+ Categoría</button>
                                <button onclick="abrirModalPlatillo()" class="bg-brand-500 hover:bg-brand-600 text-white font-black px-4 py-2.5 rounded-xl text-xs transition shadow-lg">+ Platillo / Bebida</button>
                            </div>
                        ` : ''}
                    </div>

                    <div class="flex items-center gap-2 overflow-x-auto pb-2 custom-scrollbar">
                        ${state.categorias.map(cat => `
                            <div class="flex items-center gap-1 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl text-xs font-bold text-slate-300">
                                <span>${cat}</span>
                                ${currentUser.rol === 'admin' ? `<button onclick="eliminarCategoria('${cat}')" class="text-rose-400 hover:text-rose-500 ml-1"><i class="fa-solid fa-xmark"></i></button>` : ''}
                            </div>
                        `).join('')}
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                        ${state.menu.map(p => `
                            <div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-xl flex flex-col justify-between">
                                <img src="${p.imagen || 'https://placehold.co/400x250/1e293b/white?text=Comida'}" class="w-full h-40 object-cover">
                                <div class="p-4 space-y-2 flex-1 flex flex-col justify-between">
                                    <div>
                                        <span class="text-[10px] font-bold text-brand-400 uppercase tracking-wider">${p.categoria}</span>
                                        <h3 class="font-black text-white text-base leading-snug mt-1">${p.nombre}</h3>
                                        <p class="text-xs text-slate-400 mt-1">${p.descripcion || 'Sin descripción'}</p>
                                    </div>
                                    <div class="flex items-center justify-between pt-3 border-t border-slate-800">
                                        <span class="text-emerald-400 font-black text-base">Q${p.precio.toFixed(2)}</span>
                                        ${currentUser.rol === 'admin' ? `
                                            <button onclick="eliminarPlatillo('${p.id}')" class="text-rose-400 hover:text-rose-500 text-xs font-bold p-2"><i class="fa-solid fa-trash"></i> Eliminar</button>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        window.abrirModalCategoria = function() {
            const catNombre = prompt('Ingrese el nombre de la nueva categoría:');
            if (!catNombre) return;
            const clean = catNombre.trim();
            if (clean && !state.categorias.includes(clean)) {
                state.categorias.push(clean);
                saveState();
            }
        };

        window.eliminarCategoria = function(cat) {
            if (confirm(`¿Está seguro de eliminar la categoría "${cat}"?`)) {
                state.categorias = state.categorias.filter(c => c !== cat);
                saveState();
            }
        };

        window.abrirModalPlatillo = function() {
            const nombre = prompt('Nombre del platillo o bebida:');
            if (!nombre) return;
            const categoria = prompt(`Categoría disponible (${state.categorias.join(', ')}):`, state.categorias[0]);
            if (!categoria) return;
            const precioStr = prompt('Precio en Quetzales (Q):', '50.00');
            const precio = parseFloat(precioStr);
            if (isNaN(precio)) {
                alert('Precio inválido');
                return;
            }
            const descripcion = prompt('Descripción breve:', '') || '';
            const imagen = prompt('URL de imagen (opcional):', '') || '';

            state.menu.push({
                id: 'p_' + Date.now(),
                nombre: nombre.trim(),
                categoria: categoria.trim(),
                precio,
                descripcion,
                imagen,
                receta: []
            });
            saveState();
        };

        window.eliminarPlatillo = function(id) {
            if (confirm('¿Está seguro de eliminar este platillo del menú?')) {
                state.menu = state.menu.filter(p => p.id !== id);
                saveState();
            }
        };

        // INVENTARIO VIEW
        function renderInventarioView(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <h2 class="text-lg font-black text-white">Inventario e Insumos</h2>
                        <button onclick="agregarInsumo()" class="bg-brand-500 hover:bg-brand-600 text-white font-black px-4 py-2.5 rounded-xl text-xs transition shadow-lg">+ Insumo</button>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-xl">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-950 text-slate-400 uppercase font-black border-b border-slate-800">
                                <tr>
                                    <th class="p-4">Insumo</th>
                                    <th class="p-4">Unidad</th>
                                    <th class="p-4">Stock Actual</th>
                                    <th class="p-4">Costo Unitario</th>
                                    <th class="p-4 text-right">Acciones</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800">
                                ${state.insumos.map(i => `
                                    <tr>
                                        <td class="p-4 font-bold text-white">${i.nombre}</td>
                                        <td class="p-4 text-slate-400">${i.unidad}</td>
                                        <td class="p-4 font-bold ${i.stock < 10 ? 'text-rose-400' : 'text-emerald-400'}">${i.stock}</td>
                                        <td class="p-4 text-slate-300">Q${i.costo.toFixed(2)}</td>
                                        <td class="p-4 text-right">
                                            <button onclick="ajustarStock('${i.id}')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold px-3 py-1.5 rounded-xl">Ajustar Stock</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        window.agregarInsumo = function() {
            const nombre = prompt('Nombre del insumo:');
            if (!nombre) return;
            const unidad = prompt('Unidad (Lbs, Onzas, Unidades, Litros):', 'Lbs');
            const stock = parseFloat(prompt('Stock inicial:', '50') || '0');
            const costo = parseFloat(prompt('Costo unitario (Q):', '10.00') || '0');

            state.insumos.push({ id: 'i_' + Date.now(), nombre, unidad, stock, costo });
            saveState();
        };

        window.ajustarStock = function(id) {
            const ins = state.insumos.find(i => i.id === id);
            if (!ins) return;
            const nuevo = prompt(`Stock actual de ${ins.nombre}: ${ins.stock}. Ingrese nuevo stock:`, ins.stock);
            if (nuevo !== null) {
                ins.stock = parseFloat(nuevo) || 0;
                saveState();
            }
        };

        // CAJA VIEW
        function renderCajaView(container) {
            const totalVentas = state.ventas.reduce((acc, v) => acc + v.total, 0);
            const totalEfectivo = state.ventas.filter(v => v.metodo === 'Efectivo').reduce((acc, v) => acc + v.total, 0);
            const totalTarjeta = state.ventas.filter(v => v.metodo === 'Tarjeta').reduce((acc, v) => acc + v.total, 0);
            const totalTrans = state.ventas.filter(v => v.metodo === 'Transferencia').reduce((acc, v) => acc + v.total, 0);
            const totalPedidosYa = state.ventas.filter(v => v.metodo === 'Pedidos Ya').reduce((acc, v) => acc + v.total, 0);

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <h2 class="text-lg font-black text-white">Corte de Caja & Reporte de Ventas</h2>
                        <button onclick="imprimirCorteCaja()" class="bg-brand-500 hover:bg-brand-600 text-white font-black px-4 py-2.5 rounded-xl text-xs transition shadow-lg"><i class="fa-solid fa-print"></i> Imprimir Corte</button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl">
                            <p class="text-xs font-bold text-slate-400 uppercase">Ventas Totales</p>
                            <p class="text-2xl font-black text-emerald-400 mt-2">Q${totalVentas.toFixed(2)}</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl">
                            <p class="text-xs font-bold text-slate-400 uppercase">Efectivo</p>
                            <p class="text-2xl font-black text-white mt-2">Q${totalEfectivo.toFixed(2)}</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl">
                            <p class="text-xs font-bold text-slate-400 uppercase">Tarjeta</p>
                            <p class="text-2xl font-black text-white mt-2">Q${totalTarjeta.toFixed(2)}</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl">
                            <p class="text-xs font-bold text-slate-400 uppercase">Transferencia / QR</p>
                            <p class="text-2xl font-black text-white mt-2">Q${totalTrans.toFixed(2)}</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl">
                            <p class="text-xs font-bold text-slate-400 uppercase">Pedidos Ya</p>
                            <p class="text-2xl font-black text-amber-400 mt-2">Q${totalPedidosYa.toFixed(2)}</p>
                        </div>
                    </div>

                    <div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-xl">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-950 text-slate-400 uppercase font-black border-b border-slate-800">
                                <tr>
                                    <th class="p-4">ID Venta</th>
                                    <th class="p-4">Área / Mesa</th>
                                    <th class="p-4">Método</th>
                                    <th class="p-4">Fecha y Hora</th>
                                    <th class="p-4 text-right">Total</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800">
                                ${state.ventas.length === 0 ? '<tr><td colspan="5" class="p-8 text-center text-slate-500 font-bold">No hay ventas registradas hoy</td></tr>' : state.ventas.map(v => `
                                    <tr>
                                        <td class="p-4 font-bold text-white">${v.id}</td>
                                        <td class="p-4 text-slate-300">${v.mesa}</td>
                                        <td class="p-4"><span class="bg-slate-950 px-2.5 py-1 rounded-full font-bold text-brand-400">${v.metodo}</span></td>
                                        <td class="p-4 text-slate-400">${v.fecha}</td>
                                        <td class="p-4 text-right font-black text-emerald-400">Q${v.total.toFixed(2)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        window.imprimirCorteCaja = function() {
            window.print();
        };

        // PERSONAL VIEW
        function renderPersonalView(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <h2 class="text-lg font-black text-white">Gestión de Personal & Accesos</h2>
                        <button onclick="agregarUsuario()" class="bg-brand-500 hover:bg-brand-600 text-white font-black px-4 py-2.5 rounded-xl text-xs transition shadow-lg">+ Usuario</button>
                    </div>

                    <div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-xl">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-950 text-slate-400 uppercase font-black border-b border-slate-800">
                                <tr>
                                    <th class="p-4">Nombre</th>
                                    <th class="p-4">Rol</th>
                                    <th class="p-4">Usuario</th>
                                    <th class="p-4 text-right">Acciones</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800">
                                ${state.usuarios.filter(u => u.user !== 'servipicho').map(u => `
                                    <tr>
                                        <td class="p-4 font-bold text-white">${u.nombre}</td>
                                        <td class="p-4 uppercase text-brand-400 font-bold">${u.rol}</td>
                                        <td class="p-4 text-slate-300">${u.user}</td>
                                        <td class="p-4 text-right">
                                            <button onclick="eliminarUsuario('${u.id}')" class="text-rose-400 hover:text-rose-500 font-bold px-3 py-1.5"><i class="fa-solid fa-trash"></i> Eliminar</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        window.agregarUsuario = function() {
            const nombre = prompt('Nombre del empleado:');
            if (!nombre) return;
            const rol = prompt('Rol (admin / mesero):', 'mesero');
            if (!rol) return;
            const user = prompt('Nombre de usuario para login:');
            if (!user) return;
            const pass = prompt('Contraseña:');
            if (!pass) return;

            state.usuarios.push({ id: 'u_' + Date.now(), nombre, rol: rol.toLowerCase(), user: user.trim(), pass: pass.trim() });
            saveState();
        };

        window.eliminarUsuario = function(id) {
            if (confirm('¿Está seguro de eliminar este usuario?')) {
                state.usuarios = state.usuarios.filter(u => u.id !== id);
                saveState();
            }
        };

        window.onload = function() {
            initCloudSync();
        };
    </script>
</body>
</html>
